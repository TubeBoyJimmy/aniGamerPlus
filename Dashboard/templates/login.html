<!DOCTYPE html>
<html lang="zh-TW">
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<script src="https://cdn.tailwindcss.com"></script>
	<script>(function(){var t=localStorage.getItem('theme');if(t==='light'||(!t&&window.matchMedia('(prefers-color-scheme: light)').matches))document.documentElement.classList.add('light');})()</script>
	<link rel="stylesheet" href="../static/css/aniGamerPlus.css">
	<link rel="shortcut icon" href="../static/img/aniGamerPlus.ico" type="image/x-icon">
	<title>登入 - aniGamerPlus 控制臺</title>
</head>
<body class="bg-gray-950 text-gray-100 min-h-screen flex items-center justify-center">
	<div class="w-full max-w-sm px-6">
		<div class="text-center mb-8">
			<h1 class="text-2xl font-bold text-gray-100">aniGamerPlus</h1>
			<p class="text-gray-500 text-sm mt-1">控制臺登入</p>
		</div>
		<form class="bg-gray-900 rounded-md border border-gray-800 p-6 shadow-lg" id="loginForm">
			<div class="mb-4">
				<input type="password" id="pw0" placeholder="輸入密碼"
					class="w-full bg-gray-800 text-gray-100 border border-gray-700 rounded-md px-4 py-2.5
					       placeholder-gray-500 outline-none hover:border-gray-500 focus:border-blue-500 focus:ring-1 focus:ring-blue-500 transition-colors">
			</div>
			<button type="submit"
				class="w-full bg-green-600 hover:bg-green-500 text-white font-medium rounded-md px-4 py-2.5 transition-colors">
				登入
			</button>
		</form>
		<div id="errorMsg" class="hidden mt-4 bg-red-900/40 border border-red-800 text-red-300 rounded-md px-4 py-3 text-sm text-center">
			密碼錯誤
		</div>
	</div>
</body>
</html>
